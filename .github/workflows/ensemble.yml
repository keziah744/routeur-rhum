# Toutes les heures : nouveau cycle GEFS (31 scénarios) ou nouvelle route ? -> route la plus sûre.
name: Scénarios (ensemble GEFS)

on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Recalculer les scénarios même sans nouveau cycle"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ensemble
  cancel-in-progress: false

jobs:
  ensemble:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      ROUTEUR_PREFER_S3: "1"
      ROUTEUR_CODE_KEZIAH: ${{ secrets.ROUTEUR_CODE_KEZIAH }}
      ROUTEUR_CODE_PAPA: ${{ secrets.ROUTEUR_CODE_PAPA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - uses: actions/cache/restore@v4
        with:
          path: |
            web/data/status.json
            web/data/weather-status.json
            web/data/wind.json
            web/data/bateaux/*/route.json
            web/data/bateaux/*/route-prev.json
            web/data/bateaux/*/status.json
            web/data/bateaux/*/feuille-de-route.csv
            web/data/bateaux/*/feuille-de-route.gpx
            web/data/bateaux/*/explain.json
            data/positions
          key: route-${{ github.run_id }}
          restore-keys: route-
      - uses: actions/cache/restore@v4
        with:
          path: |
            web/data/ensemble-status.json
            web/data/bateaux/*/ensemble.json
            web/data/bateaux/*/route-safe.json
          key: ens-${{ github.run_id }}
          restore-keys: ens-
      - uses: actions/cache/restore@v4
        with:
          path: data/gefs
          key: gefs-${{ github.run_id }}
          restore-keys: gefs-
      - id: before
        run: echo "gefs=$(sha1sum data/gefs/current.json 2>/dev/null | cut -c1-40)" >> "$GITHUB_OUTPUT"

      - name: Scénarios
        run: |
          if ! ls web/data/bateaux/*/route.json >/dev/null 2>&1; then echo "Pas encore de route GFS : rien à faire."; exit 0; fi
          python -m routeur ensemble ${{ inputs.force && '--force' || '' }}

      - id: after
        run: |
          echo "gefs=$(sha1sum data/gefs/current.json 2>/dev/null | cut -c1-40)" >> "$GITHUB_OUTPUT"
          find data/gefs -name '*.grb2' -delete || true
      - if: steps.after.outputs.gefs != steps.before.outputs.gefs
        uses: actions/cache/save@v4
        with:
          path: data/gefs
          key: gefs-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            web/data/ensemble-status.json
            web/data/bateaux/*/ensemble.json
            web/data/bateaux/*/route-safe.json
          key: ens-${{ github.run_id }}-${{ github.run_attempt }}

      # La route a pu changer pendant le calcul : on reprend la dernière avant de publier.
      - uses: actions/cache/restore@v4
        with:
          path: |
            web/data/status.json
            web/data/weather-status.json
            web/data/wind.json
            web/data/bateaux/*/route.json
            web/data/bateaux/*/route-prev.json
            web/data/bateaux/*/status.json
            web/data/bateaux/*/feuille-de-route.csv
            web/data/bateaux/*/feuille-de-route.gpx
            web/data/bateaux/*/explain.json
            data/positions
          key: route-latest-${{ github.run_id }}
          restore-keys: route-
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
