# Depuis le téléphone : « Run workflow », coller la position lue dans le jeu -> route recalculée et publiée.
name: Saisir ma position

on:
  workflow_dispatch:
    inputs:
      bateau:
        description: "Bateau"
        type: choice
        default: "keziah"
        options: ["keziah", "papa"]
      latitude:
        description: "Latitude comme dans le jeu (ex. 46°12'30\" N)"
        required: true
      longitude:
        description: "Longitude comme dans le jeu (ex. 23°40'06\" W)"
        required: true
      voile:
        description: "Voile actuelle (facultatif)"
        type: choice
        default: "je ne sais pas"
        options: ["je ne sais pas", "Foc", "Spi", "Trinquette", "Foc léger", "Code 0", "Gennaker lourd", "Gennaker léger"]
      porte:
        description: "Prochaine marque à passer"
        type: choice
        default: "1 - Îlot Tête à l'Anglais"
        options: ["1 - Îlot Tête à l'Anglais", "2 - Bouée Basse-Terre", "3 - Les Saintes", "4 - Bouée d'atterrissage PP", "5 - Arrivée"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: route
  cancel-in-progress: false

jobs:
  position:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      ROUTEUR_PREFER_S3: "1"
      ROUTEUR_CODE_KEZIAH: ${{ secrets.ROUTEUR_CODE_KEZIAH }}
      ROUTEUR_CODE_PAPA: ${{ secrets.ROUTEUR_CODE_PAPA }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            web/data/status.json
            web/data/weather-status.json
            web/data/wind.json
            web/data/bateaux/*/route.json
            web/data/bateaux/*/route-prev.json
            web/data/bateaux/*/status.json
            web/data/bateaux/*/feuille-de-route.csv
            web/data/bateaux/*/feuille-de-route.gpx
            web/data/bateaux/*/explain.json
            data/positions
          key: route-${{ github.run_id }}
          restore-keys: route-
      - uses: actions/cache/restore@v4
        with:
          path: |
            web/data/ensemble-status.json
            web/data/bateaux/*/ensemble.json
            web/data/bateaux/*/route-safe.json
          key: ens-${{ github.run_id }}
          restore-keys: ens-
      - uses: actions/cache/restore@v4
        with:
          path: data/gfs
          key: gfs-${{ github.run_id }}
          restore-keys: gfs-

      - name: Position + recalcul
        env:
          LAT: ${{ inputs.latitude }}
          LON: ${{ inputs.longitude }}
          VOILE: ${{ inputs.voile }}
          PORTE: ${{ inputs.porte }}
          BATEAU: ${{ inputs.bateau }}
        run: |
          voile="$VOILE"; [ "$voile" = "je ne sais pas" ] && voile=""
          python -m routeur --bateau "$BATEAU" position --lat "$LAT" --lon "$LON" --voile "$voile" --porte "${PORTE%% *}"

      - run: find data/gfs -name '*.grb2' -delete || true
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            web/data/status.json
            web/data/weather-status.json
            web/data/wind.json
            web/data/bateaux/*/route.json
            web/data/bateaux/*/route-prev.json
            web/data/bateaux/*/status.json
            web/data/bateaux/*/feuille-de-route.csv
            web/data/bateaux/*/feuille-de-route.gpx
            web/data/bateaux/*/explain.json
            data/positions
          key: route-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
