# Toutes les 5 min : une position envoyée depuis la page (ntfy.sh) ? -> route du bateau recalculée et publiée.
# C'est aussi le réveil des autres calculs : les lancements programmés de GitHub ne partent pas sur ce dépôt,
# une minuterie externe (cron-job.org) lance ce relais, qui lance la route (h:05) et les scénarios (h:35).
name: Positions reçues (relais)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

jobs:
  # Coup d'œil rapide (quelques secondes) : rien de nouveau sur ntfy -> on s'arrête là.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      new: ${{ steps.poll.outputs.new }}
    steps:
      # Route toutes les 15 min (h:05, h:20, h:50 ; h:35 laissé aux scénarios) : un nouveau run GFS est pris dès
      # qu'il est complet, au lieu d'attendre jusqu'à 1 h. Sans météo ni position nouvelles, un calcul ne coûte
      # qu'une minute. Fenêtres de 5 min (un réveil toutes les 5 min) ; scénarios : fenêtre de 10 min.
      - name: Réveil de la route (toutes les 15 min) et des scénarios (h:35)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          m=$((10#$(date -u +%M)))
          q=$((m % 15))
          if [ "$q" -ge 5 ] && [ "$q" -lt 10 ] && { [ "$m" -lt 35 ] || [ "$m" -ge 45 ]; }; then gh workflow run route.yml --repo "$GITHUB_REPOSITORY" && echo "Route lancée."; fi
          if [ "$m" -ge 35 ] && [ "$m" -lt 45 ]; then gh workflow run ensemble.yml --repo "$GITHUB_REPOSITORY" && echo "Scénarios lancés."; fi
          true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config.toml
          sparse-checkout-cone-mode: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/relay-state.json
            data/alerts-state.json
          key: relay-${{ github.run_id }}
          restore-keys: relay-
      - id: poll
        run: |
          topic=$(python3 -c "import tomllib; print(tomllib.load(open('config.toml', 'rb'))['relay']['ntfy_topic'])")
          since=$(python3 -c "import json; print(json.load(open('data/relay-state.json')).get('last_id') or '12h')" 2>/dev/null || echo 12h)
          if curl -fsS --max-time 30 "https://ntfy.sh/$topic/json?poll=1&since=$since" | grep -q '"event":"message"'; then
            echo "new=1" >> "$GITHUB_OUTPUT"; echo "Nouveaux messages depuis $since."
          else
            echo "Rien de nouveau depuis $since."
          fi

  relay:
    needs: check
    if: needs.check.outputs.new == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: route
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      ROUTEUR_PREFER_S3: "1"
      ROUTEUR_ALERTES: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            web/data/status.json
            web/data/weather-status.json
            web/data/wind.json
            web/data/bateaux/*/route.json
            web/data/bateaux/*/route-prev.json
            web/data/bateaux/*/status.json
            web/data/bateaux/*/feuille-de-route.csv
            web/data/bateaux/*/feuille-de-route.gpx
            web/data/bateaux/*/explain.json
            data/positions
          key: route-${{ github.run_id }}
          restore-keys: route-
      - uses: actions/cache/restore@v4
        with:
          path: |
            web/data/ensemble-status.json
            web/data/bateaux/*/ensemble.json
            web/data/bateaux/*/route-safe.json
          key: ens-${{ github.run_id }}
          restore-keys: ens-
      - uses: actions/cache/restore@v4
        with:
          path: data/gfs
          key: gfs-${{ github.run_id }}
          restore-keys: gfs-
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/relay-state.json
            data/alerts-state.json
          key: relay-${{ github.run_id }}
          restore-keys: relay-
      - id: before
        run: echo "gfs=$(sha1sum data/gfs/current.json 2>/dev/null | cut -c1-40)" >> "$GITHUB_OUTPUT"

      - name: Positions + recalcul
        run: python -m routeur relais

      - id: after
        run: |
          echo "gfs=$(sha1sum data/gfs/current.json 2>/dev/null | cut -c1-40)" >> "$GITHUB_OUTPUT"
          find data/gfs -name '*.grb2' -delete || true
      - if: steps.after.outputs.gfs != steps.before.outputs.gfs
        uses: actions/cache/save@v4
        with:
          path: data/gfs
          key: gfs-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/relay-state.json
            data/alerts-state.json
          key: relay-${{ github.run_id }}-${{ github.run_attempt }}
      - if: hashFiles('data/.relais-nouveau') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            web/data/status.json
            web/data/weather-status.json
            web/data/wind.json
            web/data/bateaux/*/route.json
            web/data/bateaux/*/route-prev.json
            web/data/bateaux/*/status.json
            web/data/bateaux/*/feuille-de-route.csv
            web/data/bateaux/*/feuille-de-route.gpx
            web/data/bateaux/*/explain.json
            data/positions
          key: route-${{ github.run_id }}-${{ github.run_attempt }}
      - if: hashFiles('data/.relais-nouveau') != ''
        uses: actions/configure-pages@v5
      - if: hashFiles('data/.relais-nouveau') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - if: hashFiles('data/.relais-nouveau') != ''
        id: deploy
        uses: actions/deploy-pages@v4
