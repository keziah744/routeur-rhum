# Toutes les heures : nouvelle météo GFS ? -> nouvelle route, explication, page publiée.
name: Route (météo GFS)

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Recalculer même sans nouvelle météo"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: route
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      ROUTEUR_PREFER_S3: "1"
      ROUTEUR_ALERTES: "1"
      ROUTEUR_CODE_KEZIAH: ${{ secrets.ROUTEUR_CODE_KEZIAH }}
      ROUTEUR_CODE_PAPA: ${{ secrets.ROUTEUR_CODE_PAPA }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      # État des calculs précédents (route, scénarios, prévision en cache).
      - uses: actions/cache/restore@v4
        with:
          path: |
            web/data/status.json
            web/data/weather-status.json
            web/data/wind.json
            web/data/bateaux/*/route.json
            web/data/bateaux/*/route-prev.json
            web/data/bateaux/*/status.json
            web/data/bateaux/*/feuille-de-route.csv
            web/data/bateaux/*/feuille-de-route.gpx
            web/data/bateaux/*/explain.json
            data/positions
          key: route-${{ github.run_id }}
          restore-keys: route-
      - uses: actions/cache/restore@v4
        with:
          path: |
            web/data/ensemble-status.json
            web/data/bateaux/*/ensemble.json
            web/data/bateaux/*/route-safe.json
          key: ens-${{ github.run_id }}
          restore-keys: ens-
      - uses: actions/cache/restore@v4
        with:
          path: data/gfs
          key: gfs-${{ github.run_id }}
          restore-keys: gfs-
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/relay-state.json
            data/alerts-state.json
          key: relay-${{ github.run_id }}
          restore-keys: relay-
      - id: before
        run: |
          echo "gfs=$(sha1sum data/gfs/current.json 2>/dev/null | cut -c1-40)" >> "$GITHUB_OUTPUT"
          echo "relay=$(cat data/relay-state.json data/alerts-state.json 2>/dev/null | sha1sum | cut -c1-40)" >> "$GITHUB_OUTPUT"

      # Positions envoyées depuis la page et pas encore relevées (le relais a pu sauter un passage), puis météo.
      - name: Météo + route
        run: |
          python -m routeur relais
          python -m routeur cycle ${{ inputs.force && '--force' || '' }}

      - id: after
        run: |
          echo "gfs=$(sha1sum data/gfs/current.json 2>/dev/null | cut -c1-40)" >> "$GITHUB_OUTPUT"
          echo "relay=$(cat data/relay-state.json data/alerts-state.json 2>/dev/null | sha1sum | cut -c1-40)" >> "$GITHUB_OUTPUT"
          find data/gfs -name '*.grb2' -delete || true
      - if: steps.after.outputs.relay != steps.before.outputs.relay
        uses: actions/cache/save@v4
        with:
          path: |
            data/relay-state.json
            data/alerts-state.json
          key: relay-${{ github.run_id }}-${{ github.run_attempt }}
      - if: steps.after.outputs.gfs != steps.before.outputs.gfs
        uses: actions/cache/save@v4
        with:
          path: data/gfs
          key: gfs-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            web/data/status.json
            web/data/weather-status.json
            web/data/wind.json
            web/data/bateaux/*/route.json
            web/data/bateaux/*/route-prev.json
            web/data/bateaux/*/status.json
            web/data/bateaux/*/feuille-de-route.csv
            web/data/bateaux/*/feuille-de-route.gpx
            web/data/bateaux/*/explain.json
            data/positions
          key: route-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
