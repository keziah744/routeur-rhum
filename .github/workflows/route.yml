# Toutes les heures : nouvelle météo GFS ? -> nouvelle route, explication, page publiée.
name: Route (météo GFS)

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Recalculer même sans nouvelle météo"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: route
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      ROUTEUR_PREFER_S3: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      # État des calculs précédents (route, scénarios, prévision en cache).
      - uses: actions/cache/restore@v4
        with:
          path: |
            web/data/route.json
            web/data/route-prev.json
            web/data/status.json
            web/data/weather-status.json
            web/data/wind.json
            web/data/feuille-de-route.csv
            web/data/feuille-de-route.gpx
            web/data/explain.json
            data/position.json
          key: route-${{ github.run_id }}
          restore-keys: route-
      - uses: actions/cache/restore@v4
        with:
          path: |
            web/data/ensemble.json
            web/data/route-safe.json
            web/data/ensemble-status.json
          key: ens-${{ github.run_id }}
          restore-keys: ens-
      - uses: actions/cache/restore@v4
        with:
          path: data/gfs
          key: gfs-${{ github.run_id }}
          restore-keys: gfs-
      - id: before
        run: echo "gfs=$(sha1sum data/gfs/current.json 2>/dev/null | cut -c1-40)" >> "$GITHUB_OUTPUT"

      - name: Météo + route
        run: python -m routeur cycle ${{ inputs.force && '--force' || '' }}

      - id: after
        run: |
          echo "gfs=$(sha1sum data/gfs/current.json 2>/dev/null | cut -c1-40)" >> "$GITHUB_OUTPUT"
          find data/gfs -name '*.grb2' -delete || true
      - if: steps.after.outputs.gfs != steps.before.outputs.gfs
        uses: actions/cache/save@v4
        with:
          path: data/gfs
          key: gfs-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            web/data/route.json
            web/data/route-prev.json
            web/data/status.json
            web/data/weather-status.json
            web/data/wind.json
            web/data/feuille-de-route.csv
            web/data/feuille-de-route.gpx
            web/data/explain.json
            data/position.json
          key: route-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
